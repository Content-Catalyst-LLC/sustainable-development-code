name: Future development viability smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'articles/future-directions-in-sustainable-development-thought/**'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: articles/future-directions-in-sustainable-development-thought
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python stress test and SQLite dashboard
        run: |
          python3 python/future_development_scenario_stress_test.py
          python3 sql/run_sqlite_dashboard.py
      - name: Show manifest
        run: |
          cat outputs/scenario_stress_test_manifest.json
